services:
  mcp-tool-filter-cf:
    build: .
    container_name: mcp-tool-filter-cf
    restart: unless-stopped
    ports:
      - "8098:8080"
    environment:
      - MCPJUNGLE_URL=http://mcp-name-bridge:8080
      - PORT=8080
      - TOP_K=15
      - DEBUG=false
    volumes:
      - model-cache:/root/.cache
    networks:
      - mcp-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  model-cache:

networks:
  mcp-network:
    external: true
